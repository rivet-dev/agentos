[package]
name = "agentos-preload"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-level package preload service and coordinator actor for agentOS"

[dependencies]
agentos-client = { workspace = true, features = ["actor-internals"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
rivetkit = "=3.0.7"
rivetkit-core = "=3.0.7"
rivet-error = "=3.0.7"
rivet-metrics = "=3.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
vfs = { workspace = true }
tar = "0.4"
