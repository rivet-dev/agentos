[package]
name = "agentos-actor-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated-contract transport support for the static agentOS actor"

[features]
default = []
contract = ["dep:ts-rs"]

[dependencies]
agentos-client = { workspace = true }
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
hex = "0.4"
rivet-error = "=2.3.12-rc.3"
rivetkit = "=2.3.12-rc.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ts-rs = { version = "10.1", features = ["no-serde-warnings", "serde-compat", "serde-json-impl"], optional = true }
