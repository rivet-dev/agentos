[package]
name = "agentos-executor-wasm-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly executor hosted by the agentOS V8 runtime"

[lib]
doctest = false

[dependencies]
agentos-executor-contract = { workspace = true }
agentos-driver-tokio = { workspace = true }
agentos-executor-v8-runtime = { workspace = true, features = ["wasm-exnref"] }
agentos-executor-wasm-abi = { workspace = true }
agentos-executor-wasm-host = { workspace = true }
flume = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
v8 = { workspace = true }

[dev-dependencies]
wat = "1"
