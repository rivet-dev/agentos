[package]
name = "agentos-executor-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine-neutral agentOS WebAssembly host imports shared by the V8 and Wasmtime executors"

[lib]
doctest = false

[dependencies]
agentos-driver-tokio = { workspace = true }
agentos-executor-contract = { workspace = true }
agentos-executor-wasm-abi = { workspace = true }
base64 = "0.22"
flume = "0.11"
nix = { version = "0.29", features = ["time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }
wasmparser = { workspace = true }

[dev-dependencies]
wat = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
