name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    # Fork PRs run on hosted machines. Incus separately enforces its workflow allowlist.
    runs-on: &incus-linux >-
      ${{ github.repository == 'rivet-dev/agentos'
          && (github.ref == 'refs/heads/main'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
          && fromJSON('["self-hosted","incus-heavy"]') || 'ubuntu-latest' }}
    env:
      AGENTOS_SKIP_NATIVE_META_BUILD: '1'
      AGENTOS_CI_CODE_ONLY_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: node --test software/git/scripts/stage-templates.test.mjs
      - run: |
          npx turbo build \
            --only \
            --concurrency=4
      - run: pnpm --dir scripts/publish run check-types
      - run: pnpm --dir scripts/publish test
      - run: python3 -B -m unittest discover -s scripts/ci/v8
      - run: node --test scripts/check-rust-package-metadata.test.mjs
      - run: node scripts/check-rust-package-metadata.mjs
      - run: node --test scripts/check-agentos-client-protocol-compat.test.mjs
      - run: node scripts/check-agentos-client-protocol-compat.mjs
      - run: node --test scripts/verify-fixed-versions.test.mjs
      - run: node scripts/verify-fixed-versions.mjs
      - run: node --test scripts/ci-selection.test.mjs
      - run: node --test scripts/check-layout.test.mjs
      - run: node --test scripts/toolchain-sysroot-order.test.mjs
      - run: node scripts/check-layout.mjs
      - run: node scripts/check-rustfmt.mjs
      - run: node scripts/verify-check-types.mjs
      - run: pnpm check-types
      - name: Run fast package unit tests
        run: |
          pnpm --parallel --aggregate-output \
            --filter '@rivet-dev/agentos-build-tools' \
            --filter '@rivet-dev/agentos-benchmarks' \
            --filter '@rivet-dev/agentos-toolchain' \
            --filter '@rivet-dev/agentos-sidecar' \
            test
      - run: pnpm exec biome check .
      - name: Pack JavaScript build outputs
        run: |
          tar \
            --exclude='software/*/dist/package' \
            --exclude='software/*/dist/package.tar' \
            --exclude='software/*/dist/package.aospkg' \
            -czf /tmp/agentos-js-dist.tar.gz \
            packages/*/dist software/*/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-dist
          path: /tmp/agentos-js-dist.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  wasm-commands:
    name: WASM Commands
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    runs-on: *incus-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh wasm
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read the owned WASM toolchain pin
        id: wasm-toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          pin = tomllib.loads(Path("toolchain/rust-toolchain.toml").read_text())
          channel = pin["toolchain"]["channel"]
          if not isinstance(channel, str) or not channel or "\n" in channel or "\r" in channel:
              raise ValueError("invalid owned WASM toolchain channel")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={channel}\n")
          PYTHON
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: ${{ steps.wasm-toolchain.outputs.channel }}
          components: rust-src
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
        with:
          workspaces: toolchain -> target
          key: wasm-commands-${{ hashFiles('toolchain/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos...' --filter '@agentos-software/*'
      # The WASM build only depends on the toolchain and per-package native
      # sources. Restore its finished outputs by the digest of those inputs and
      # skip every make step on a hit. GitHub scopes caches by branch: PRs read
      # main's entries, and nothing a PR saves is visible to main.
      - name: Hash the WASM build inputs
        id: wasm-inputs
        run: |
          if ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')) }}; then mode=full; else mode=pr; fi
          digest=$(bash scripts/ci/wasm-inputs-digest.sh)
          echo "key=wasm-outputs-v1-${{ runner.os }}-${{ runner.arch }}-$mode-$digest" >> "$GITHUB_OUTPUT"
          echo "full-key=wasm-outputs-v1-${{ runner.os }}-${{ runner.arch }}-full-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore WASM build outputs
        id: wasm-outputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.wasm-inputs.outputs.key }}
          # A PR-mode build can reuse a complete build of the same inputs.
          restore-keys: ${{ steps.wasm-inputs.outputs.full-key }}
          path: |
            toolchain/target/wasm32-wasip1/release/commands
            toolchain/c/build/awk.COPYING
            toolchain/c/build/pthread_conformance.wasm
            toolchain/c/build/pthread_benchmark.wasm
            toolchain/c/build/exec_variants
            toolchain/c/build/conformance
            ${{ runner.temp }}/agentos-software-build-inputs.tar.gz
            ${{ runner.temp }}/agentos-software-build-inputs.sha256
      - name: Build the default software PR command corpus
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: make -C toolchain pr-commands
      - name: Build the complete command corpus
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: make -C toolchain commands
      # DuckDB and Vim are intentionally outside the default command set because
      # they are heavy builds, but the runtime/parity suites require their real
      # command artifacts.
      - name: Build required heavy integration commands
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: make -C toolchain cmd/duckdb cmd/vim
      - name: Build mandatory threaded-WASM conformance fixtures
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: make -C toolchain/c pthread-conformance-wasm pthread-benchmark-wasm
      - name: Stage native/WASM C parity fixtures
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: make -C toolchain/c conformance-artifacts
      - name: Stage the default software PR command corpus
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        run: node packages/core/scripts/copy-wasm-commands.mjs --require-default
      - name: Stage the complete command corpus
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        run: node packages/core/scripts/copy-wasm-commands.mjs --require
      - name: Package default software once
        run: |
          pnpm --filter @rivet-dev/agentos-toolchain build
          pnpm --filter @agentos-software/manifest build
          pnpm --parallel \
            --filter @agentos-software/coreutils \
            --filter @agentos-software/sed \
            --filter @agentos-software/grep \
            --filter @agentos-software/gawk \
            --filter @agentos-software/findutils \
            --filter @agentos-software/diffutils \
            --filter @agentos-software/tar \
            --filter @agentos-software/gzip \
            build
          mapfile -t default_packages < <(node -e 'for (const name of require("./software/default-software.json")) console.log(`software/${name}/dist/package.aospkg`)')
          for artifact in "${default_packages[@]}"; do test -s "$artifact" || exit 1; done
          tar -czf /tmp/agentos-default-software.tar.gz "${default_packages[@]}"
      - name: Package pinned software build inputs
        if: steps.wasm-outputs.outputs.cache-matched-key == '' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci'))
        run: |
          # Both sources already exist from this job's real Git/Vim builds.
          test -f toolchain/c/libs/vim/runtime/defaults.vim
          node software/git/scripts/stage-templates.mjs
          node software/vim/scripts/stage-runtime.mjs
          python3 - <<'PYTHON'
          import os
          import re
          import shutil
          from pathlib import Path

          stage = Path(os.environ["RUNNER_TEMP"]) / "agentos-software-build-inputs"
          stage.mkdir()
          version = re.search(r"^GIT_VERSION\s*:=\s*(\S+)\s*$", Path("toolchain/c/Makefile").read_text(), re.M).group(1)
          git = Path(f"toolchain/c/build/git-upstream/git-{version}")
          inputs = [
              "Makefile", "shared.mak", "config.mak.uname",
              "GIT-VERSION-GEN", "GIT-VERSION-FILE.in", "version",
              "GIT-BUILD-OPTIONS.in", "git-submodule.sh", "git-sh-setup.sh",
              "git-sh-i18n.sh", "tools/generate-script.sh", "gitweb/Makefile",
              "templates/Makefile",
          ]
          templates = (git / "templates/Makefile").read_text()
          inputs += [f"templates/{name}" for name in re.findall(r"^TEMPLATES \+= (.+)$", templates, re.M)]
          for name in inputs:
              source = git / name
              if not source.is_file() or source.is_symlink():
                  raise ValueError(f"missing regular Git packaging input: {source}")
              target = stage / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          # Reuse the staging helper's exact selection; do not ship the vendor tree.
          shutil.copytree("software/vim/share/vim/vim92", stage / "toolchain/c/libs/vim/runtime")
          PYTHON
          (
            cd "$RUNNER_TEMP/agentos-software-build-inputs"
            find toolchain -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/agentos-software-build-inputs.sha256"
          cp "$RUNNER_TEMP/agentos-software-build-inputs.sha256" "$RUNNER_TEMP/agentos-software-build-inputs/"
          tar -C "$RUNNER_TEMP/agentos-software-build-inputs" -czf "$RUNNER_TEMP/agentos-software-build-inputs.tar.gz" .
      - name: Save WASM build outputs
        if: steps.wasm-outputs.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.wasm-inputs.outputs.key }}
          path: |
            toolchain/target/wasm32-wasip1/release/commands
            toolchain/c/build/awk.COPYING
            toolchain/c/build/pthread_conformance.wasm
            toolchain/c/build/pthread_benchmark.wasm
            toolchain/c/build/exec_variants
            toolchain/c/build/conformance
            ${{ runner.temp }}/agentos-software-build-inputs.tar.gz
            ${{ runner.temp }}/agentos-software-build-inputs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        with:
          name: software-build-inputs
          path: ${{ runner.temp }}/agentos-software-build-inputs.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        with:
          name: wasm-commands
          path: packages/core/commands
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: default-software
          path: /tmp/agentos-default-software.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        with:
          name: wasm-command-licenses
          path: toolchain/c/build/awk.COPYING
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        with:
          name: wasm-thread-fixtures
          path: |
            toolchain/c/build/pthread_conformance.wasm
            toolchain/c/build/pthread_benchmark.wasm
            toolchain/c/build/exec_variants
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
        with:
          name: wasm-c-parity-fixtures
          path: toolchain/c/build/conformance
          if-no-files-found: error

  executor-feature-isolation:
    permissions:
      contents: read
      actions: read
    name: Executor Feature Isolation
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    runs-on: *incus-linux
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - name: Install reviewed V8 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/v8/engine.py install x86_64-unknown-linux-gnu "$RUNNER_TEMP/agentos-v8" --allow-actions --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml" --github-env "$GITHUB_ENV"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
        with:
          key: feature-isolation-${{ hashFiles('Cargo.lock') }}
      - name: Install V8 bridge build dependencies
        run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos-build-tools...'
      - name: Check native executor feature isolation
        run: |
          cargo check -p agentos-vm --no-default-features
          cargo run -p agentos-vm --no-default-features --example embedded_os
          cargo check -p agentos-vfs-core --no-default-features
          cargo test -p agentos-vfs-storage --no-default-features --lib
          for feature in local mounted s3
          do
            cargo check \
              -p agentos-vfs-storage \
              --no-default-features \
              --features "$feature"
          done
          node scripts/check-embedded-vm-dependencies.mjs
          node scripts/check-executor-feature-dependencies.mjs
          cargo build --profile embedded -p agentos-example-embedded-vm
          target/embedded/agentos-example-embedded-vm
          node scripts/check-embedded-vm-size.mjs \
            target/embedded/agentos-example-embedded-vm
          for feature in \
            node-v8 \
            python-v8-pyodide \
            wasm-v8
          do
            cargo check \
              -p agentos-sidecar \
              --no-default-features \
              --features "$feature"
          done

  rust-clippy:
    permissions:
      contents: read
      actions: read
    name: Rust Clippy
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    runs-on: *incus-linux
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - name: Install reviewed V8 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/v8/engine.py install x86_64-unknown-linux-gnu "$RUNNER_TEMP/agentos-v8" --allow-actions --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml" --github-env "$GITHUB_ENV"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
      - name: Install V8 bridge build dependencies
        run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos-build-tools...'
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    permissions:
      contents: read
      actions: read
    name: Rust
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    runs-on: *incus-linux
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - name: Install reviewed V8 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/v8/engine.py install x86_64-unknown-linux-gnu "$RUNNER_TEMP/agentos-v8" --allow-actions --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml" --github-env "$GITHUB_ENV"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
      - name: Install V8 bridge build dependencies
        run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos-build-tools...'
      - name: Verify generated VM config bindings
        run: |
          cargo test -p agentos-vm-config --quiet
          git diff --exit-code -- packages/core/src/generated
      - name: Verify the generated hosted actor contract
        run: pnpm --dir packages/agentos-bindgen check
      - name: Build PR sidecar binaries
        run: cargo build -p agentos-sidecar
      - name: Check VM architecture boundaries
        run: cargo test -p agentos-vm --test architecture_guards -- --test-threads=1
      - run: cargo test -p agentos-sidecar -- --test-threads=1
      - name: Test Rust client contracts
        env:
          AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/target/debug/agentos-sidecar
        run: |
          cargo test -p agentos-client --features contract \
            --lib \
            --test limits_config \
            --test scaffold \
            --test e2e_smoke \
            --test fs_e2e \
            --test lifecycle_e2e \
            --test process_exit_signal_e2e \
            --test mount_e2e \
            --test sidecar_pool_e2e \
            --test sidecar_runtime_e2e \
            --test cron_e2e \
            --test cron_grammar_e2e \
            -- --test-threads=1
      - name: Test Rust sidecar watchdog controls
        timeout-minutes: 2
        shell: bash
        run: |
          cargo test -p agentos-sidecar-client --lib watchdog_ -- --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/sidecar-watchdog.log"
          node --input-type=module - "$RUNNER_TEMP/sidecar-watchdog.log" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, statSync} from 'node:fs';
          const path = process.argv[2];
          assert.ok(statSync(path).size <= 16 * 1024 * 1024);
          const text = readFileSync(path, 'utf8');
          const expected = ["transport::tests::watchdog_host_stall_does_not_expire_before_readers_run", "transport::tests::watchdog_reset_anchor_and_stale_confirmation_are_fenced", "transport::tests::watchdog_ready_pipe_heartbeat_cancels_near_threshold_expiry", "transport::tests::watchdog_partial_frame_survives_confirmation_and_eof_cancels", "transport::tests::watchdog_read_error_cancels_pending_confirmation", "transport::tests::watchdog_genuine_silence_expires_during_repeated_host_stalls", "transport::tests::silence_watchdog_fails_pending_requests_after_sustained_silence", "transport::tests::silence_watchdog_stays_quiet_while_frames_arrive"];
          const passed = [...text.matchAll(/^test (transport::tests::\S+) \.\.\. ok$/gm)].map(match => match[1]);
          assert.deepEqual(passed.sort(), expected.sort());
          assert.match(text, /test result: ok\. 8 passed; 0 failed; 0 ignored;/);
          NODE
          cargo test -p agentos-sidecar-client --lib transport::tests::write_files_negotiation_preserves_advertised_caps_and_rejects_zero -- --exact --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/sidecar-negotiation.log"
          cargo test -p agentos-sidecar-protocol --lib wire::tests::write_files_capabilities_are_required_and_typed_on_wire -- --exact --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/wire-capabilities.log"
          cargo test -p agentos-sidecar-protocol --lib wire::tests::write_files_data_bytes_have_identical_bare_layout_and_json_shape -- --exact --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/wire-bytes.log"
          node --input-type=module - "$RUNNER_TEMP" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, statSync} from 'node:fs';
          import {join} from 'node:path';
          const controls = [["transport::tests::write_files_negotiation_preserves_advertised_caps_and_rejects_zero", "sidecar-negotiation.log"], ["wire::tests::write_files_capabilities_are_required_and_typed_on_wire", "wire-capabilities.log"], ["wire::tests::write_files_data_bytes_have_identical_bare_layout_and_json_shape", "wire-bytes.log"]];
          for (const [name, file] of controls) {
            const path = join(process.argv[2], file);
            assert.ok(statSync(path).size <= 16 * 1024 * 1024);
            const text = readFileSync(path, 'utf8');
            const passed = [...text.matchAll(/^test (\S+) \.\.\. ok$/gm)].map(match => match[1]);
            assert.deepEqual(passed, [name]);
            assert.match(text, /test result: ok\. 1 passed; 0 failed; 0 ignored;/);
          }
          NODE
      - name: Stage stripped sidecar artifacts
        run: |
          mkdir -p ci-artifacts/agentos-sidecar
          cp target/debug/agentos-sidecar ci-artifacts/agentos-sidecar/agentos-sidecar
          strip --strip-all ci-artifacts/agentos-sidecar/agentos-sidecar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentos-sidecar
          path: ci-artifacts/agentos-sidecar/agentos-sidecar
          retention-days: 1
          if-no-files-found: error
  core-pr:
    name: Core transport PR
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    needs: [checks]
    runs-on: *incus-linux
    env:
      AGENTOS_SKIP_NATIVE_META_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos...'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: js-dist
          path: ci-artifacts/js
      - name: Restore JavaScript build inputs
        run: |
          tar -xzf ci-artifacts/js/agentos-js-dist.tar.gz
      - run: pnpm --dir packages/core exec vitest run tests/frame-stream.test.ts tests/event-buffer.test.ts tests/protocol-frames.test.ts tests/protocol-client.test.ts tests/sidecar-process.test.ts tests/response-payloads.test.ts

  core-runtime-pr:
    name: Core runtime PR
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    needs: [checks, rust, wasm-commands]
    runs-on: *incus-linux
    env:
      AGENTOS_SKIP_NATIVE_META_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos...' --filter 'secure-exec...' --filter '@rivet-dev/agentos-toolchain...'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: js-dist
          path: ci-artifacts/js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentos-sidecar
          path: ci-artifacts/agentos-sidecar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: default-software
          path: ci-artifacts/default-software
      - name: Restore runtime inputs
        run: |
          tar -xzf ci-artifacts/js/agentos-js-dist.tar.gz
          tar -xzf ci-artifacts/default-software/agentos-default-software.tar.gz
          chmod +x ci-artifacts/agentos-sidecar/agentos-sidecar
          node packages/core/scripts/stage-default-software.mjs
      - run: pnpm --dir packages/core test:pr
        env:
          AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/ci-artifacts/agentos-sidecar/agentos-sidecar
      - name: Test focused runtime compatibility regressions
        timeout-minutes: 2
        working-directory: packages/core
        env:
          AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/ci-artifacts/agentos-sidecar/agentos-sidecar
        run: |
          node ../agentos-toolchain/scripts/test.mjs tests/node-v8-native-wire.native.test.ts tests/node-v8-heap-statistics.native.test.ts tests/mount.test.ts tests/limits.test.ts tests/filesystem-write-files.test.ts \
            --testNamePattern '(?:node:v8 preserves graphs and exchanges native serialization with Node.js|node:v8 heap statistics report live isolate use through CJS and ESM|failed host mount callbacks preserve EIO metadata and exists diagnostics|invalid host exists responses log their type without payload data|reactor\.operationDeadlineMs bounds an undrained socket write|a failed entry reports its own error and every other entry is written|writeFiles batches existing public writes without single-file RPCs|writeFiles splits more than the server entry cap without changing order)$' \
            --cache=false --fileParallelism=false --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/runtime-compatibility.json"
          node --input-type=module - "$RUNNER_TEMP/runtime-compatibility.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, statSync} from 'node:fs';
          const path = process.argv[2];
          assert.ok(statSync(path).size <= 16 * 1024 * 1024);
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const expected = ["node:v8 preserves graphs and exchanges native serialization with Node.js", "node:v8 heap statistics report live isolate use through CJS and ESM", "failed host mount callbacks preserve EIO metadata and exists diagnostics", "invalid host exists responses log their type without payload data", "reactor.operationDeadlineMs bounds an undrained socket write", "a failed entry reports its own error and every other entry is written", "writeFiles batches existing public writes without single-file RPCs", "writeFiles splits more than the server entry cap without changing order"];
          const rows = report.testResults.flatMap(file => file.assertionResults);
          const executed = rows.filter(row => row.status === 'passed' || row.status === 'failed');
          assert.equal(report.success, true);
          assert.equal(report.numPassedTests, 8);
          assert.equal(report.numFailedTests, 0);
          assert.deepEqual(executed.map(row => row.title).sort(), expected.sort());
          assert.ok(executed.every(row => row.status === 'passed'));
          NODE
      - run: pnpm --dir secure-exec build
      - run: pnpm --dir secure-exec test
        env:
          AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/ci-artifacts/agentos-sidecar/agentos-sidecar

  # Selects the crates.io publish rehearsal on PRs. Pushes to main always run it.
  crates-changes:
    name: Crates publish inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          changed=false
          # Manifests, build scripts, and the publish tooling, or Rust source
          # that reads files at compile time (a packaged crate holds only its
          # own directory).
          if git diff --name-only "$base" HEAD \
              | grep -qE '((^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|(^|/)\.gitignore$|^scripts/publish/|^\.github/workflows/(publish\.yaml|ci\.yml)$)' \
            || git diff -U0 "$base" HEAD -- '*.rs' | grep -qE '^\+.*(include_(str|bytes)!|#\[path)'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Slower than the PR budget, so it stays out of CI / Required.
  crates-rehearsal:
    name: Rehearse crates.io publish
    needs: [crates-changes]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.crates-changes.outputs.changed == 'true') }}
    runs-on: *incus-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: pnpm install --frozen-lockfile
      - name: Rehearse crate publish
        run: pnpm --filter=publish exec tsx src/ci/bin.ts publish-crates --rehearse

  # Selects the hosted integration tests on PRs. Pushes to main always run them.
  hosted-changes:
    name: Hosted test inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          changed=false
          # The hosted actor, its contract and client, the fixture, or the
          # pinned RivetKit version (crate manifests and the npm catalog).
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(crates/(actor|actor-contract|preload)/|packages/core/(src/hosted|tests/hosted-)|packages/agentos-bindgen/|examples/hosted/|scripts/(run-hosted-local\.mjs|hosted-local-config\.mjs|hosted-owned-supervisor\.py)$|\.github/workflows/ci\.yml$)' \
            || git diff -U0 "$base" HEAD -- pnpm-workspace.yaml | grep -qiE '^[+-].*rivetkit'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Slower than the PR budget, so it stays out of CI / Required.
  hosted-tests:
    permissions:
      contents: read
      actions: read
    name: Hosted integration
    needs: [hosted-changes, checks, wasm-commands]
    if: ${{ always() && needs.checks.result == 'success' && needs.wasm-commands.result == 'success' && (github.event_name != 'pull_request' || needs.hosted-changes.outputs.changed == 'true') }}
    runs-on: *incus-linux
    timeout-minutes: 30
    env:
      AGENTOS_SKIP_NATIVE_META_BUILD: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - name: Install reviewed V8 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/v8/engine.py install x86_64-unknown-linux-gnu "$RUNNER_TEMP/agentos-v8" --allow-actions --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml" --github-env "$GITHUB_ENV"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
        with:
          key: hosted-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos...' --filter '@rivet-dev/agentos-build-tools...' --filter '@rivet-dev/agentos-example-hosted...'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: js-dist
          path: ci-artifacts/js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: default-software
          path: ci-artifacts/default-software
      - name: Restore hosted test inputs
        run: |
          tar -xzf ci-artifacts/js/agentos-js-dist.tar.gz
          tar -xzf ci-artifacts/default-software/agentos-default-software.tar.gz
      - name: Build the hosted worker and the Rust hosted tests
        run: |
          cargo build -p agentos-sidecar --features hosted
          cargo test -p agentos-actor --test hosted_transport --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "hosted_transport") | .executable' \
            > "$RUNNER_TEMP/hosted-rust-test"
          test -x "$(cat "$RUNNER_TEMP/hosted-rust-test")"
      # The engine is the lockfile-pinned @rivetkit/engine-cli binary.
      - name: Run the hosted tests against a local engine
        run: |
          node scripts/hosted-local-config.mjs \
            --worker target/debug/agentos-sidecar \
            --rust-test "$(cat "$RUNNER_TEMP/hosted-rust-test")" \
            --out "$RUNNER_TEMP/hosted-config.json" \
            --evidence "$RUNNER_TEMP/hosted-evidence"
          node scripts/run-hosted-local.mjs --run "$RUNNER_TEMP/hosted-config.json"
      - name: Show the hosted test output
        if: failure()
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/hosted-evidence/*/{ts-*,rust-hosted}.std{out,err}.log; do
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

  required:
    name: CI / Required
    if: ${{ always() && (github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')) }}
    needs: [checks, wasm-commands, rust, rust-clippy, executor-feature-isolation, core-pr, core-runtime-pr, wasm-backend-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          WASM_RESULT: ${{ needs.wasm-commands.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}
          FEATURE_ISOLATION_RESULT: ${{ needs.executor-feature-isolation.result }}
          CORE_RESULT: ${{ needs.core-pr.result }}
          CORE_RUNTIME_RESULT: ${{ needs.core-runtime-pr.result }}
          WASM_BACKEND_RESULT: ${{ needs.wasm-backend-matrix.result }}
          EXPECT_WASM_BACKEND_MATRIX: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci') }}
        run: |
          for result in \
            "$CHECKS_RESULT" \
            "$WASM_RESULT" \
            "$RUST_RESULT" \
            "$RUST_CLIPPY_RESULT" \
            "$FEATURE_ISOLATION_RESULT" \
            "$CORE_RESULT" \
            "$CORE_RUNTIME_RESULT"; do
            if [ "$result" != success ]; then
              echo "required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
          if [ "$EXPECT_WASM_BACKEND_MATRIX" = true ] && [ "$WASM_BACKEND_RESULT" != success ]; then
              echo "required WASM backend CI job did not succeed: $WASM_BACKEND_RESULT" >&2
            exit 1
          fi

  wasm-backend-matrix:
    permissions:
      contents: read
      actions: read
    name: "WASM backend (${{ matrix.backend }})"
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aggregate-ci')
    needs: [wasm-commands]
    runs-on: *incus-linux
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        backend: [v8]
    env:
      AGENTOS_TEST_WASM_BACKEND: ${{ matrix.backend }}
      AGENTOS_E2E_NETWORK: '1'
      AGENT_OS_CLIENT_ALLOW_E2E_SKIPS: '0'
      AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/target/release/agentos-sidecar
      AGENTOS_WASM_COMMANDS_DIR: ${{ github.workspace }}/packages/core/commands
      AGENTOS_C_WASM_COMMANDS_DIR: ${{ github.workspace }}/toolchain/c/build/conformance
      XFSTESTS_ROOT: ${{ github.workspace }}/tests/xfstests/.work/xfstests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - name: Install reviewed V8 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/v8/engine.py install x86_64-unknown-linux-gnu "$RUNNER_TEMP/agentos-v8" --allow-actions --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml" --github-env "$GITHUB_ENV"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
        with:
          key: wasm-backend-${{ matrix.backend }}
      - run: pnpm install --frozen-lockfile
      - name: Install native protocol fixture prerequisites
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends g++-14 pkg-config openssh-server curl
            sudo mkdir -p /run/sshd
          fi
          command -v g++-14 pkg-config
          test -x /usr/sbin/sshd && test -d /run/sshd
          /usr/bin/curl --version | grep -w sftp
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: curl-protocol-fixtures
        with:
          path: ${{ runner.temp }}/agentos-curl-protocol-fixtures
          key: native-curl-protocol-v1-${{ runner.os }}-${{ runner.arch }}-gcc14-${{ hashFiles('toolchain/c/scripts/build-native-http3-fixture.sh', 'toolchain/c/scripts/check-generation-limit.sh') }}
      - name: Build pinned native HTTP/3 fixtures
        if: steps.curl-protocol-fixtures.outputs.cache-hit != 'true'
        timeout-minutes: 15
        env:
          PREFIX: ${{ runner.temp }}/agentos-http3
          CACHE_DIR: ${{ runner.temp }}/agentos-http3-sources
          JOBS: '4'
          NATIVE_CC: gcc-14
          NATIVE_CXX: g++-14
        run: |
          bash toolchain/c/scripts/build-native-http3-fixture.sh
          mkdir -p "$RUNNER_TEMP/agentos-curl-protocol-fixtures"
          cp -L "$PREFIX/bin/curl" "$PREFIX/bin/nghttpx" "$RUNNER_TEMP/agentos-curl-protocol-fixtures/"
      - name: Select native protocol fixtures
        run: |
          fixture_dir="$RUNNER_TEMP/agentos-curl-protocol-fixtures"
          "$fixture_dir/curl" --version | grep -w HTTP3
          "$fixture_dir/nghttpx" --version
          printf 'AGENTOS_NATIVE_HTTP3_CURL=%s/curl\nAGENTOS_NGHTTPX_HTTP3_SERVER=%s/nghttpx\n' "$fixture_dir" "$fixture_dir" >> "$GITHUB_ENV"
          printf 'SSHD=/usr/sbin/sshd\n' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-commands
          path: packages/core/commands
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-command-licenses
          path: toolchain/c/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-thread-fixtures
          path: toolchain/c/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-c-parity-fixtures
          path: toolchain/c/build/conformance
      - name: Restore native C parity executable modes
        run: find toolchain/c/build/conformance/native -maxdepth 1 -type f -exec chmod 0755 '{}' +
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: software-build-inputs
          path: ci-artifacts/software-build-inputs
      - name: Restore pinned software build inputs
        run: |
          tar -xzf ci-artifacts/software-build-inputs/agentos-software-build-inputs.tar.gz
          sha256sum --strict --check agentos-software-build-inputs.sha256
          test -x toolchain/c/build/git-upstream/git-*/tools/generate-script.sh
      - name: Restore and package the validated command corpus
        run: |
          mkdir -p toolchain/target/wasm32-wasip1/release/commands
          cp -a packages/core/commands/. toolchain/target/wasm32-wasip1/release/commands/
          node packages/core/scripts/copy-wasm-commands.mjs --require
          pnpm --filter @agentos-software/manifest build
          pnpm --filter @rivet-dev/agentos-toolchain build
          pnpm --filter @agentos-software/coreutils build:runtime
          pnpm --filter '@agentos-software/*' build
      - name: Stage pinned xfstests and its WASM helper corpus
        run: make -C tests/xfstests helpers XFSTESTS_BUILD_NATIVE_COMMANDS=0
      - name: Build the release sidecar and public test clients
        run: |
          cargo build --release -p agentos-sidecar
          pnpm --filter '@rivet-dev/agentos...' build
          pnpm --filter @rivet-dev/agentos-test-harness build
      - name: Run native sidecar ownership acceptance
        timeout-minutes: 2
        env:
          AGENTOS_STAB_HOSTED_LIFECYCLE_NATIVE: '1'
        run: |
          pnpm --dir packages/core exec vitest run \
            tests/sidecar-forced-exit.native.test.ts \
            tests/pending-creation.native.test.ts \
            --fileParallelism=false --maxWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/agentos-native-ownership.json"
          node --input-type=module - "$RUNNER_TEMP/agentos-native-ownership.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, statSync } from 'node:fs';
          const path = process.argv[2];
          assert.ok(statSync(path).size <= 16 * 1024 * 1024, 'native ownership report exceeds16MiB');
          const result = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(result.success, true);
          assert.equal(result.numTotalTests, 2);
          assert.equal(result.numPassedTests, 2);
          assert.equal(result.numPendingTests, 0, 'native ownership tests must not skip');
          NODE
      - name: Run actor lifecycle cancellation ownership
        timeout-minutes: 15
        env:
          AGENTOS_STAB_HOSTED_LIFECYCLE_NATIVE: '1'
        run: |
          cargo test --release --locked -p agentos-actor --lib runtime::tests:: \
            -- --ignored --list > "$RUNNER_TEMP/agentos-actor-native-ownership.txt"
          diff -u scripts/ci/actor-native-lifecycle-tests.txt \
            "$RUNNER_TEMP/agentos-actor-native-ownership.txt"
          cargo test --release --locked -p agentos-actor --lib runtime::tests:: \
            -- --ignored --nocapture --test-threads=1
      - name: Run all sidecar tests through the selected VM backend
        run: cargo test --release -p agentos-vm --features all-executors --tests --no-fail-fast -- --test-threads=1
      - name: Run native-vs-WASM C conformance through the selected VM backend
        run: pnpm --dir packages/core exec vitest run --root ../.. toolchain/conformance/c-parity.test.ts --reporter=verbose --maxWorkers=1
      - name: Run core WASM and cross-runtime integration serially
        run: pnpm --dir packages/core exec vitest run --reporter=verbose --maxWorkers=1
      - name: Run the public Rust client without artifact skips
        run: cargo test -p agentos-client -- --test-threads=1
      - name: Run every registry software suite through the selected WASM backend
        run: pnpm exec turbo test --concurrency=1 --filter='@agentos-software/*'
      - name: Run every registry software nightly suite through the selected WASM backend
        run: pnpm exec turbo test:nightly --concurrency=1 --filter='@agentos-software/*'
