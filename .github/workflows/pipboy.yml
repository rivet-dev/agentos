# Pip-Boy: what a change does to the packages we ship, in one PR comment.
#
# Every job runs on `pull_request` or `push`. Only `report` gets a write token,
# it builds nothing, and it comments only on same-repo PRs. Pushes to main
# store baselines that later PRs compare against. Spec and tooling:
# scripts/pipboy.
name: pipboy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: pipboy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.changes.outputs.base }}
      base_history: ${{ steps.changes.outputs.base_history }}
      footprint: ${{ steps.changes.outputs.footprint }}
      tool: ${{ steps.changes.outputs.tool }}
      rust: ${{ steps.changes.outputs.rust }}
      native: ${{ steps.changes.outputs.native }}
      native_matrix: ${{ steps.changes.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The sidecar binaries the publish workflow ships, on the same runners.
          # `linux` builds on any Rust change; the rest build on platform-specific
          # changes or the `ci: native-all` label, which is read on the next push.
          NATIVE_ALL: >-
            [
            {"platform":"linux-x64-gnu","target":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","dockerfile":"linux-gnu","clang":"","tier":"linux","smoke_runner":"ubuntu-24.04"},
            {"platform":"linux-arm64-gnu","target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","dockerfile":"linux-gnu","clang":"","tier":"all","smoke_runner":"ubuntu-24.04-arm"},
            {"platform":"darwin-x64","target":"x86_64-apple-darwin","runner":"ubuntu-latest","dockerfile":"darwin","clang":"x86_64-apple-darwin20.4","tier":"all","smoke_runner":"macos-15"},
            {"platform":"darwin-arm64","target":"aarch64-apple-darwin","runner":"ubuntu-latest","dockerfile":"darwin","clang":"aarch64-apple-darwin20.4","tier":"all","smoke_runner":"macos-15"}
            ]
        run: |
          RUST='(\.(rs|cc|h)$|(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^rust-toolchain\.toml$|^docker/build/|^scripts/ci/v8/(archives\.json|source\.json|engine\.py|.*\.patch)$|^scripts/pipboy/|^\.github/workflows/pipboy\.yml$)'
          PLATFORM_SENSITIVE='((^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.(cc|h)$|^docker/build/|^scripts/ci/v8/(archives\.json|source\.json|engine\.py|.*\.patch)$|^rust-toolchain\.toml$)'
          matrix() { jq -c --arg tier "$1" 'map(select($tier == "all" or .tier == $tier))' <<< "$NATIVE_ALL"; }

          if [ "$EVENT" != "pull_request" ]; then
            # Pushes to main record baselines. Natives build only when Rust changed,
            # and then for every platform. Hygiene stores no baseline, so it skips main.
            echo "footprint=true" >> "$GITHUB_OUTPUT"
            echo "tool=true" >> "$GITHUB_OUTPUT"
            echo "rust=false" >> "$GITHUB_OUTPUT"
            native=none
            if ! files="$(git diff --name-only "$PUSH_BEFORE" HEAD 2>/dev/null)" || grep -qE "$RUST" <<< "$files"; then
              native=all
            fi
            echo "native=$native" >> "$GITHUB_OUTPUT"
            echo "native_matrix=$(matrix "$native")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base_history=$(git rev-list --first-parent -n 200 "$base" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          files="$(git diff --name-only "$base" HEAD)"
          footprint=false
          if grep -qE '^(packages/|pnpm-(lock|workspace)\.yaml|scripts/pipboy/|scripts/publish/|\.github/workflows/pipboy\.yml)' <<< "$files" \
            && jq -e 'index("ci: full-footprint")' <<< "$LABELS" > /dev/null; then
            footprint=true
          elif grep -qE '^(packages/|pnpm-(lock|workspace)\.yaml|scripts/pipboy/|scripts/publish/|\.github/workflows/pipboy\.yml)' <<< "$files"; then
            echo 'Full package footprint is deferred for this PR. Add the `ci: full-footprint` label to build and measure complete source artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "footprint=$footprint" >> "$GITHUB_OUTPUT"
          tool=false
          if grep -qE '^(scripts/pipboy/|scripts/publish/|\.github/workflows/pipboy\.yml)' <<< "$files"; then
            tool=true
          fi
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          rust=false
          native=none
          if grep -qE "$RUST" <<< "$files"; then
            rust=true
            native=linux
            if grep -qE "$PLATFORM_SENSITIVE" <<< "$files" \
              || git diff -U0 "$base" HEAD -- '*.rs' | grep -qE '^\+.*(cfg\(target_|target_os|target_arch)' \
              || jq -e 'index("ci: native-all")' <<< "$LABELS" > /dev/null; then
              native=all
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$(matrix "$native")" >> "$GITHUB_OUTPUT"

  self-test:
    name: self-test
    needs: changes
    if: needs.changes.outputs.tool == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter 'pipboy...'
      - run: pnpm --filter pipboy check-types
      # Replays the September 2026 registry drift against a local npm registry.
      - run: pnpm --filter pipboy test

  footprint:
    name: footprint
    needs: changes
    if: needs.changes.outputs.footprint == 'true'
    # Full command and software builds are explicit on PRs and run on main for baselines.
    runs-on: &incus-linux >-
      ${{ github.repository == 'rivet-dev/agentos'
          && (github.ref == 'refs/heads/main'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
          && fromJSON('["self-hosted","incus-heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      # This measures npm tarballs; the platform binary is measured by native.
      # Core's Turbo dependency can otherwise build the excluded sidecar package.
      AGENTOS_SKIP_NATIVE_META_BUILD: '1'
    permissions:
      contents: read
      actions: read # download the base tarballs from a main run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh wasm
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(runner.name, 'ci-0') }}
        with:
          workspaces: toolchain -> target
          key: wasm-commands-${{ hashFiles('toolchain/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile

      - name: Build the complete command corpus from this checkout
        run: |
          make -C toolchain commands
          make -C toolchain cmd/duckdb cmd/vim
          node packages/core/scripts/copy-wasm-commands.mjs --require

      - name: Pack this commit
        run: pnpm --silent --filter pipboy pipboy pack --source-assets --out "$RUNNER_TEMP/pr"

      - name: Store tarballs as the baseline for later PRs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: footprint-tarballs
          path: ${{ runner.temp }}/pr
          retention-days: 90

      - name: Fetch the base tarballs from main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: pnpm --silent --filter pipboy pipboy baseline --sha "$BASE_SHA" --artifact footprint-tarballs --out "$RUNNER_TEMP/base"

      # Main has no baseline for this commit (older than this workflow, or
      # expired), so pack the merge base here with this commit's tool.
      - name: Pack the base
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found != 'true'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "$BASE_SHA"
          pnpm --dir "$RUNNER_TEMP/base-src" install --frozen-lockfile
          pnpm --silent --filter pipboy pipboy pack --root "$RUNNER_TEMP/base-src" --out "$RUNNER_TEMP/base"

      - name: Measure
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          base=()
          if [ "$EVENT" = "pull_request" ]; then base=(--base "$RUNNER_TEMP/base"); fi
          pnpm --silent --filter pipboy pipboy footprint --pr "$RUNNER_TEMP/pr" "${base[@]}" --out "$RUNNER_TEMP/reports/footprint.json"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-footprint
          path: ${{ runner.temp }}/reports/footprint.json
          if-no-files-found: ignore
          retention-days: 30

  hygiene:
    name: hygiene
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: *incus-linux
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh raw
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter 'pipboy...'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      # cargo deny reads every crate's manifest; caching the registry skips the downloads.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Check out the base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: git worktree add "$RUNNER_TEMP/pipboy-base/src" "$BASE_SHA"
      - name: Stage the matching Rust source for each dependency comparison
        run: |
          python3 scripts/ci/v8/engine.py install-glue "$GITHUB_WORKSPACE" "$RUNNER_TEMP/v8-pr-glue" --cargo-config "$GITHUB_WORKSPACE/.cargo/config.toml"
          if test -d "$RUNNER_TEMP/pipboy-base/src"; then
            python3 scripts/ci/v8/engine.py install-glue "$RUNNER_TEMP/pipboy-base/src" "$RUNNER_TEMP/v8-base-glue" --cargo-config "$RUNNER_TEMP/pipboy-base/.cargo/config.toml"
          fi
      - name: Diff findings
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          base=()
          if [ "$EVENT" = "pull_request" ]; then base=(--base-root "$RUNNER_TEMP/pipboy-base/src"); fi
          pnpm --silent --filter pipboy pipboy hygiene "${base[@]}" --out "$RUNNER_TEMP/reports/hygiene.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-hygiene
          path: ${{ runner.temp }}/reports/hygiene.json
          if-no-files-found: ignore
          retention-days: 30

  native:
    name: native · ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.native != 'none'
    runs-on: >-
      ${{ github.repository == 'rivet-dev/agentos'
          && matrix.runner == 'ubuntu-latest'
          && (github.ref == 'refs/heads/main'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
          && fromJSON('["self-hosted","incus-heavy"]') || matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Attach persistent Incus caches
        if: startsWith(runner.name, 'ci-0')
        run: bash scripts/ci/incus-cache.sh docker
      # The publish workflow's Dockerfile and build arguments in release mode, so
      # the size is what ships. Toolchain versions are read from publish.yaml.
      - name: Stage the target's reviewed engine archive
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/ci/v8/engine.py fetch "$TARGET" "$RUNNER_TEMP/v8-inputs" --allow-actions
      - name: Build with the publish Dockerfile
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CLANG: ${{ matrix.clang }}
        run: |
          publish_env() { sed -n "s/^  $1: \"\(.*\)\"$/\1/p" .github/workflows/publish.yaml; }
          args=(--build-arg "CACHE_SCOPE=${CI_CACHE_SCOPE:-hosted}" --build-arg "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}" --build-arg "TARGET=$TARGET" --build-arg BUILD_PROFILE=release --build-arg "CACHE_PLATFORM=$PLATFORM"
            --build-arg "RUST_TOOLCHAIN=$(publish_env RUST_TOOLCHAIN)")
          if [ "$DOCKERFILE" = darwin ]; then
            args+=(--build-arg "CLANG=$CLANG")
          else
            args+=(--build-arg "LINUX_GNU_LLVM_VERSION=$(publish_env LINUX_GNU_LLVM_VERSION)"
              --build-arg "LINUX_GNU_SYSROOT_TAG=$(publish_env LINUX_GNU_SYSROOT_TAG)")
          fi
          tag="pipboy-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PLATFORM"
          cid=""
          trap 'if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null; fi; docker image rm "$tag" >/dev/null || true' EXIT
          docker buildx build --build-context "agentos-v8-inputs=$RUNNER_TEMP/v8-inputs" -f "docker/build/$DOCKERFILE.Dockerfile" "${args[@]}" -t "$tag" --load .
          cid="$(docker create --label rivet.ci.extraction=true "$tag")"
          docker cp "$cid:/artifacts/agentos-sidecar" "$RUNNER_TEMP/agentos-native-sidecar"
      # Transfer only the release binary, never Cargo or package caches.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-sidecar-${{ matrix.platform }}
          path: ${{ runner.temp }}/agentos-native-sidecar
          retention-days: 1
          if-no-files-found: error
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No pnpm cache: this job runs fork code and doesn't need one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter 'pipboy...'
      - name: Measure
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          pnpm --silent --filter pipboy pipboy native --target agentos-native-sidecar --platform "$PLATFORM" \
            --artifact "$RUNNER_TEMP/agentos-native-sidecar" --out "$RUNNER_TEMP/reports/native-agentos-native-sidecar-$PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-native-agentos-native-sidecar-${{ matrix.platform }}
          path: ${{ runner.temp }}/reports/native-agentos-native-sidecar-${{ matrix.platform }}.json
          retention-days: 90

  native-smoke:
    name: execute · ${{ matrix.platform }}
    needs: [changes, native]
    if: needs.changes.outputs.native != 'none'
    runs-on: ${{ matrix.smoke_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-sidecar-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-smoke
      - name: Enable x64 execution on the macOS arm64 host
        if: matrix.platform == 'darwin-x64'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter '@rivet-dev/agentos...'
      - name: Execute the release sidecar through its matching public client
        env:
          AGENTOS_SIDECAR_BIN: ${{ runner.temp }}/native-smoke/agentos-native-sidecar
        run: |
          chmod +x "$AGENTOS_SIDECAR_BIN"
          pnpm --dir packages/core exec vitest run tests/native-platform-smoke.test.ts --reporter=verbose

  report:
    name: report
    needs: [changes, footprint, hygiene, native, native-smoke]
    # Not `always()`: a run cancelled by a newer push must not post its partial results.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # job timings, report artifacts, and native baselines from main
      pull-requests: write # the one Pip-Boy comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter 'pipboy...'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: report-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      - name: Write the comment and run summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # Empty for pushes and fork PRs: they get the run summary only.
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_HISTORY: ${{ needs.changes.outputs.base_history }}
          # Each check job's result, so a failed job is reported as failed, not skipped.
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          pnpm --silent --filter pipboy pipboy report --reports "$RUNNER_TEMP/reports" \
            --base-history "$BASE_HISTORY"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uvx zizmor@1.31.1 --offline --min-severity low .github/workflows
