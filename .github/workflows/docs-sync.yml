name: Sync docs

# Docs live here; rivet.dev publishes them. On merge to main this copies the
# docs/ bundle into the website's vendor/agentos and opens a PR there, which is
# also what triggers the site rebuild.
#
# examples/ travels with the bundle because agentOS docs embed snippets from
# this repository by repo-root-relative path.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "secure-exec/docs/**"
      - "secure-exec/examples/**"
      - ".github/workflows/docs-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rivet-dev/website/.github/actions/sync-docs@main
        with:
          product: agentos
          token: ${{ secrets.RIVET_WEBSITE_TOKEN }}
          extra-paths: examples

  # Secure Exec ships from this repository but is its own product on rivet.dev,
  # so it syncs as a second bundle with its own examples.
  sync-secure-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rivet-dev/website/.github/actions/sync-docs@main
        with:
          product: secure-exec
          source: secure-exec/docs
          token: ${{ secrets.RIVET_WEBSITE_TOKEN }}
          extra-paths: secure-exec/examples
