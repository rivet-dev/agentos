name: Promote reviewed V8 archives
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'promote-reviewed-v8' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'security/v8-upgrade')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter publish
      - name: Verify, publish and download every reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: pnpm --filter publish exec tsx src/ci/publish-v8-archives.ts "$GITHUB_WORKSPACE"
