name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 or 0.2.0-rc.1). Leave empty for preview publish on the dispatched branch."
        required: false
        type: string
      latest:
        description: "Tag as @latest (release only)"
        required: true
        type: boolean
        default: true
      profile:
        description: "Native binary build profile. Auto keeps releases optimized and previews in debug mode."
        required: true
        type: choice
        options:
          - auto
          - release
          - debug
        default: auto

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET: rivet-releases
  R2_ENDPOINT: https://2a94c6a0ced8d35ea63cddc86c2681e7.r2.cloudflarestorage.com
  SIDECAR_PLATFORMS: "linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64"
  # Keep the Docker defaults in sync with the release compiler.
  RUST_TOOLCHAIN: "1.95.0"
  LINUX_GNU_LLVM_VERSION: "22"
  LINUX_GNU_SYSROOT_TAG: "sysroot-20250207"

jobs:
  context:
    name: Context
    runs-on: ubuntu-latest
    outputs:
      trigger: ${{ steps.ctx.outputs.trigger }}
      version: ${{ steps.ctx.outputs.version }}
      npm_tag: ${{ steps.ctx.outputs.npm_tag }}
      sha: ${{ steps.ctx.outputs.sha }}
      latest: ${{ steps.ctx.outputs.latest }}
      build_profile: ${{ steps.mode.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter=publish --filter=@rivet-dev/agentos-toolchain
      - id: ctx
        name: Resolve publish context
        run: pnpm --filter=publish exec tsx src/ci/bin.ts context-output
      - id: mode
        name: Resolve native build profile
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          TRIGGER: ${{ steps.ctx.outputs.trigger }}
        run: |
          set -euo pipefail
          profile="${REQUESTED_PROFILE:-auto}"
          if [ "$profile" = "auto" ]; then
            if [ "$TRIGGER" = "release" ]; then
              profile="release"
            else
              profile="debug"
            fi
          fi
          case "$profile" in
            release|debug) ;;
            *) echo "invalid native build profile: $profile" >&2; exit 2 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

  # The WASM command corpus builds from source in three parallel jobs of this
  # run. Each job builds its own patched sysroot (about 2 minutes) instead of
  # sharing one, so no build output crosses runs or waits on another job.
  wasm-commands-default:
    name: WASM Commands (default set)
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - run: pnpm install --frozen-lockfile --filter '@rivet-dev/agentos...'
      - run: make -C toolchain commands
      # tar keeps the alias and stub symlinks of the canonical command tree.
      - name: Pack the default command tree
        run: tar -C toolchain/target/wasm32-wasip1/release -cf "$RUNNER_TEMP/wasm-commands-default.tar" commands
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-commands-part-default
          path: ${{ runner.temp }}/wasm-commands-default.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-command-licenses
          path: toolchain/c/build/awk.COPYING
          if-no-files-found: error
      # The git software package builds its templates from the pinned upstream
      # source, so Publish npm needs these files from this job's Git build.
      - name: Pack the Git packaging inputs
        run: |
          set -euo pipefail
          node software/git/scripts/stage-templates.mjs
          python3 - <<'PYTHON'
          import re
          import tarfile
          import os
          from pathlib import Path

          version = re.search(r"^GIT_VERSION\s*:=\s*(\S+)\s*$", Path("toolchain/c/Makefile").read_text(), re.M).group(1)
          git = Path(f"toolchain/c/build/git-upstream/git-{version}")
          inputs = [
              "Makefile", "shared.mak", "config.mak.uname",
              "GIT-VERSION-GEN", "GIT-VERSION-FILE.in", "version",
              "GIT-BUILD-OPTIONS.in", "git-submodule.sh", "git-sh-setup.sh",
              "git-sh-i18n.sh", "tools/generate-script.sh", "gitweb/Makefile",
              "templates/Makefile",
          ]
          templates = (git / "templates/Makefile").read_text()
          inputs += [f"templates/{name}" for name in re.findall(r"^TEMPLATES \+= (.+)$", templates, re.M)]
          with tarfile.open(Path(os.environ["RUNNER_TEMP"]) / "software-build-inputs-git.tar", "w") as archive:
              for name in inputs:
                  source = git / name
                  if not source.is_file() or source.is_symlink():
                      raise ValueError(f"missing regular Git packaging input: {source}")
                  archive.add(source)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: software-build-inputs-git
          path: ${{ runner.temp }}/software-build-inputs-git.tar
          if-no-files-found: error

  # These real upstream commands are intentionally outside the fast default
  # toolchain target, but are part of the published and parity-tested corpus.
  # They are C builds against the patched sysroot and need no Rust or Node.
  wasm-commands-heavy:
    name: WASM Commands (${{ matrix.command }})
    strategy:
      matrix:
        command: [duckdb, vim]
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@v4
      - run: make -C toolchain cmd/${{ matrix.command }}
      - name: Pack the ${{ matrix.command }} command
        run: |
          set -euo pipefail
          test -s "toolchain/target/wasm32-wasip1/release/commands/${{ matrix.command }}"
          tar -C toolchain/target/wasm32-wasip1/release -cf "$RUNNER_TEMP/wasm-commands-${{ matrix.command }}.tar" "commands/${{ matrix.command }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-commands-part-${{ matrix.command }}
          path: ${{ runner.temp }}/wasm-commands-${{ matrix.command }}.tar
          if-no-files-found: error
      # The vim software package ships the runtime files of this Vim build.
      # Pack the staging helper's exact selection, not the vendor tree.
      - name: Pack the Vim runtime packaging inputs
        if: matrix.command == 'vim'
        run: |
          set -euo pipefail
          test -f toolchain/c/libs/vim/runtime/defaults.vim
          node software/vim/scripts/stage-runtime.mjs
          stage="$RUNNER_TEMP/software-build-inputs-vim"
          mkdir -p "$stage/toolchain/c/libs/vim"
          cp -R software/vim/share/vim/vim92 "$stage/toolchain/c/libs/vim/runtime"
          tar -C "$stage" -cf "$RUNNER_TEMP/software-build-inputs-vim.tar" toolchain
      - uses: actions/upload-artifact@v4
        if: matrix.command == 'vim'
        with:
          name: software-build-inputs-vim
          path: ${{ runner.temp }}/software-build-inputs-vim.tar
          if-no-files-found: error

  # Merge the parts, then check completeness on the full set. Downstream jobs
  # depend on this job and the `wasm-commands` artifact it uploads.
  wasm-commands:
    needs: [wasm-commands-default, wasm-commands-heavy]
    name: WASM Commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-commands-part-*
          path: ${{ runner.temp }}/wasm-commands-parts
          merge-multiple: true
      - name: Restore canonical WASM command staging
        run: |
          set -euo pipefail
          release_dir="toolchain/target/wasm32-wasip1/release"
          mkdir -p "$release_dir"
          for part in default duckdb vim; do
            tar -C "$release_dir" -xf "$RUNNER_TEMP/wasm-commands-parts/wasm-commands-$part.tar"
          done
      - run: node packages/core/scripts/copy-wasm-commands.mjs --require
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-commands
          path: packages/core/commands
          if-no-files-found: error

  build-sidecar:
    needs: [context]
    name: "Build linux native artifacts (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          name: agentos-${{ matrix.platform }}
      - name: Build linux artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/linux-gnu.Dockerfile
          build-args: |
            TARGET=${{ matrix.target }}
            BUILD_PROFILE=${{ needs.context.outputs.build_profile }}
            CACHE_PLATFORM=${{ matrix.platform }}
            RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}
            LINUX_GNU_LLVM_VERSION=${{ env.LINUX_GNU_LLVM_VERSION }}
            LINUX_GNU_SYSROOT_TAG=${{ env.LINUX_GNU_SYSROOT_TAG }}
          tags: agentos-linux-${{ matrix.platform }}
          load: true
      - name: Extract linux artifacts
        id: extract
        run: |
          set -euo pipefail
          sidecar_out="target/sidecar-artifacts/${{ matrix.platform }}"
          mkdir -p "$sidecar_out"
          cid=$(docker create agentos-linux-${{ matrix.platform }})
          docker cp "$cid:/artifacts/agentos-sidecar" "$sidecar_out/agentos-sidecar"
          docker rm "$cid"
          test -f "$sidecar_out/agentos-sidecar"
          echo "sidecar_dir=$sidecar_out" >> "$GITHUB_OUTPUT"
      - name: Check glibc floor
        run: |
          scripts/ci/check-linux-glibc-floor.sh \
            "${{ steps.extract.outputs.sidecar_dir }}/agentos-sidecar"
      - name: Smoke-run binaries in old Linux containers
        run: |
          scripts/ci/smoke-linux-artifacts.sh binary \
            "${{ steps.extract.outputs.sidecar_dir }}/agentos-sidecar"
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: ${{ steps.extract.outputs.sidecar_dir }}
          if-no-files-found: error

  build-sidecar-darwin:
    needs: [context]
    name: "Build darwin binaries (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            runner: ubuntu-latest
            target: x86_64-apple-darwin
            clang: x86_64-apple-darwin20.4
          - platform: darwin-arm64
            runner: ubuntu-latest
            target: aarch64-apple-darwin
            clang: aarch64-apple-darwin20.4
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          name: agentos-${{ matrix.platform }}
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Cross-compile via osxcross
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/darwin.Dockerfile
          build-args: |
            TARGET=${{ matrix.target }}
            CLANG=${{ matrix.clang }}
            BUILD_PROFILE=${{ needs.context.outputs.build_profile }}
            CACHE_PLATFORM=${{ matrix.platform }}
            RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}
          tags: agentos-darwin-${{ matrix.platform }}
          load: true
      - name: Extract darwin artifacts
        run: |
          set -euo pipefail
          sidecar_out="target/sidecar-artifacts/${{ matrix.platform }}"
          mkdir -p "$sidecar_out"
          cid=$(docker create agentos-darwin-${{ matrix.platform }})
          docker cp "$cid:/artifacts/agentos-sidecar" "$sidecar_out/agentos-sidecar"
          docker rm "$cid"
          test -f "$sidecar_out/agentos-sidecar"
          case "${{ matrix.platform }}" in
            darwin-x64) expected_arch="x86_64" ;;
            darwin-arm64) expected_arch="arm64" ;;
            *) echo "unknown darwin platform: ${{ matrix.platform }}" >&2; exit 2 ;;
          esac
          file "$sidecar_out/agentos-sidecar" | grep -F "$expected_arch"
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: target/sidecar-artifacts/${{ matrix.platform }}
          if-no-files-found: error

  publish-npm:
    needs: [context, wasm-commands, build-sidecar, build-sidecar-darwin]
    name: Publish npm
    if: ${{ !cancelled() && needs.wasm-commands.result == 'success' && needs.build-sidecar.result == 'success' && needs.build-sidecar-darwin.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-commands
          path: packages/core/commands
      - uses: actions/download-artifact@v4
        with:
          name: wasm-command-licenses
          path: toolchain/c/build
      - name: Restore canonical WASM command staging
        run: |
          set -euo pipefail
          commands_dir="toolchain/target/wasm32-wasip1/release/commands"
          mkdir -p "$commands_dir"
          cp -a packages/core/commands/. "$commands_dir/"
          test -s "$commands_dir/sh"
      - uses: actions/download-artifact@v4
        with:
          pattern: software-build-inputs-*
          path: ${{ runner.temp }}/software-build-inputs
          merge-multiple: true
      - name: Restore Git and Vim packaging inputs
        run: |
          set -euo pipefail
          for part in git vim; do
            tar -xf "$RUNNER_TEMP/software-build-inputs/software-build-inputs-$part.tar"
          done
          test -x toolchain/c/build/git-upstream/git-*/tools/generate-script.sh
          test -f toolchain/c/libs/vim/runtime/defaults.vim
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          path: artifacts
      - name: Place sidecar binaries into platform packages
        run: |
          set -euo pipefail
          for p in $SIDECAR_PLATFORMS; do
            agent_bin="artifacts/sidecar-${p}/agentos-sidecar"
            agent_dest="packages/sidecar/npm/${p}"
            test -f "$agent_bin"
            test -d "$agent_dest"
            cp "$agent_bin" "${agent_dest}/agentos-sidecar"
            chmod +x "${agent_dest}/agentos-sidecar"
          done
      - name: Bump package versions for build
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts bump-versions \
            --version ${{ needs.context.outputs.version }} \
            --version-only
      - run: node packages/core/scripts/copy-wasm-commands.mjs --require
      - name: Build TypeScript packages
        env:
          AGENTOS_SKIP_NATIVE_META_BUILD: "1"
        run: |
          npx turbo build \
            --filter='!./examples/*' \
            --filter='!./examples/quickstart/*'
      - name: Stage immutable software artifacts
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts stage-software \
            --output "$GITHUB_WORKSPACE/software-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: software-artifacts
          path: software-artifacts
          if-no-files-found: error
      - name: Finalize package versions for publish
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts bump-versions \
            --version ${{ needs.context.outputs.version }}
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts publish-npm \
            --tag ${{ needs.context.outputs.npm_tag }} \
            --parallel 16 \
            --retries 3 \
            ${{ needs.context.outputs.trigger == 'release' && '--release-mode' || '' }}
      - name: Upload software artifacts to R2
        if: ${{ needs.context.outputs.trigger == 'release' }}
        env:
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          VERSION: ${{ needs.context.outputs.version }}
          SHA: ${{ needs.context.outputs.sha }}
          LATEST: ${{ needs.context.outputs.latest }}
        run: |
          set -euo pipefail
          test -n "$R2_RELEASES_ACCESS_KEY_ID"
          test -n "$R2_RELEASES_SECRET_ACCESS_KEY"
          pnpm --filter=publish exec tsx src/ci/bin.ts upload-r2 \
            --source "$GITHUB_WORKSPACE/software-artifacts" --sha "$SHA" --name software
          pnpm --filter=publish exec tsx src/ci/bin.ts copy-r2 \
            --sha "$SHA" --version "$VERSION" --latest "$LATEST" --name software
          curl --fail --silent --show-error --head --retry 6 --retry-delay 5 --retry-all-errors \
            "https://releases.rivet.dev/agent-os/${VERSION}/software/default-software.json" >/dev/null
          if [ "$LATEST" = "true" ]; then
            curl --fail --silent --show-error --head --retry 6 --retry-delay 5 --retry-all-errors \
              "https://releases.rivet.dev/agent-os/latest/software/default-software.json" >/dev/null
          fi

  release-assets:
    needs: [context, build-sidecar, build-sidecar-darwin]
    name: Release assets
    if: ${{ !cancelled() && needs.build-sidecar.result == 'success' && needs.build-sidecar-darwin.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter=publish --filter=@rivet-dev/agentos-toolchain
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          path: artifacts
      - name: Stage release assets
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          declare -A PLATFORM_TARGET=(
            [linux-x64-gnu]=x86_64-unknown-linux-gnu
            [linux-arm64-gnu]=aarch64-unknown-linux-gnu
            [darwin-x64]=x86_64-apple-darwin
            [darwin-arm64]=aarch64-apple-darwin
          )
          mkdir -p release-assets
          for p in $SIDECAR_PLATFORMS; do
            target="${PLATFORM_TARGET[$p]}"
            cp "artifacts/sidecar-${p}/agentos-sidecar" "release-assets/agentos-sidecar-${target}"
          done
          chmod +x release-assets/agentos-sidecar-*
          if [ -d crates/executor-v8-runtime/assets/pyodide ]; then
            mkdir -p release-assets/pyodide
            cp -R crates/executor-v8-runtime/assets/pyodide/. release-assets/pyodide/
          fi
      - name: Create GitHub release and upload assets
        if: ${{ needs.context.outputs.trigger == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.context.outputs.version }}
          NPM_TAG: ${{ needs.context.outputs.npm_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            PRERELEASE=""
            if [ "${NPM_TAG}" = "rc" ]; then PRERELEASE="--prerelease"; fi
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes $PRERELEASE
          fi
          # Upload FILES only — a bare `release-assets/*` glob matches the
          # pyodide directory itself and `gh release upload` cannot upload dirs.
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "v${VERSION}" --clobber
          if [ -d release-assets/pyodide ]; then
            find release-assets/pyodide -maxdepth 1 -type f -print0 | xargs -0 gh release upload "v${VERSION}" --clobber
          fi
      - name: Upload release assets to R2
        if: ${{ needs.context.outputs.trigger == 'release' }}
        env:
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          VERSION: ${{ needs.context.outputs.version }}
          SHA: ${{ needs.context.outputs.sha }}
          LATEST: ${{ needs.context.outputs.latest }}
        run: |
          set -euo pipefail
          test -n "$R2_RELEASES_ACCESS_KEY_ID"
          test -n "$R2_RELEASES_SECRET_ACCESS_KEY"
          pnpm --filter=publish exec tsx src/ci/bin.ts upload-r2 \
            --source "$GITHUB_WORKSPACE/release-assets" --sha "$SHA"
          pnpm --filter=publish exec tsx src/ci/bin.ts copy-r2 \
            --sha "$SHA" --version "$VERSION" --latest "$LATEST"
          curl --fail --silent --show-error --head --retry 6 --retry-delay 5 --retry-all-errors \
            "https://releases.rivet.dev/agent-os/${VERSION}/sidecar/agentos-sidecar-x86_64-unknown-linux-gnu" >/dev/null
          if [ "$LATEST" = "true" ]; then
            curl --fail --silent --show-error --head --retry 6 --retry-delay 5 --retry-all-errors \
              "https://releases.rivet.dev/agent-os/latest/sidecar/agentos-sidecar-x86_64-unknown-linux-gnu" >/dev/null
          fi

  publish-crates:
    needs: [context, build-sidecar, release-assets]
    name: Publish crates.io
    if: ${{ !cancelled() && needs.build-sidecar.result == 'success' && (needs.release-assets.result == 'success' || needs.release-assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/.rusty_v8
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-rusty-v8-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-rusty-v8-
      - run: pnpm install --frozen-lockfile
      - name: Bump Cargo versions
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts bump-versions \
            --version ${{ needs.context.outputs.version }} \
            --version-only
      - name: Stage vendored V8 bridge bundles and base filesystem
        run: |
          set -euo pipefail
          # crates/executor-v8-runtime/assets/generated is gitignored; the
          # published crates fall back to the v8-runtime build helper's
          # vendored bundle and panic if it is absent. Stage it here.
          out="crates/executor-v8-runtime/assets/generated"
          mkdir -p "$out"
          node packages/build-tools/scripts/build-v8-bridge.mjs --out-dir "$out"
          git add -f crates/executor-v8-runtime/assets/generated
          # The single committed base filesystem lives in the vfs crate; the
          # kernel and sidecar crates vendor a copy for isolated publish
          # builds (their build.rs falls back to assets/base-filesystem.json).
          mkdir -p crates/vm-kernel/assets crates/vm/assets
          cp crates/vfs-core/assets/base-filesystem.json crates/vm-kernel/assets/base-filesystem.json
          cp crates/vfs-core/assets/base-filesystem.json crates/vm/assets/base-filesystem.json
      - name: Dry-run crate publish
        if: ${{ needs.context.outputs.trigger != 'release' }}
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts publish-crates \
            --version ${{ needs.context.outputs.version }} \
            --dry-run \
            --allow-dirty
      - name: Publish crates
        if: ${{ needs.context.outputs.trigger == 'release' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts publish-crates \
            --version ${{ needs.context.outputs.version }} \
            --allow-dirty

  notify-managed-services:
    name: Notify managed services
    needs: [context, publish-npm, release-assets, publish-crates]
    if: ${{ success() && needs.context.outputs.trigger == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify managed services
        env:
          GH_TOKEN: ${{ secrets.MANAGED_SERVICES_DISPATCH_TOKEN }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          gh api --method POST /repos/rivet-dev/services/dispatches \
            -f event_type=downstream-release \
            -f client_payload[product]=agentos \
            -f client_payload[version]="$VERSION" \
            -f client_payload[sha]="$GITHUB_SHA"
